# .github/workflows/sync.yml
name: Update from Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest src/index.js from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/bobbobL/cfset/main/src/index.js -o src/index.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet src/index.js && exit 0
          git add src/index.js
          git commit -m "chore: sync latest worker code from upstream"
          git push
